<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JARVIS 个人中控台</title>
  <link rel="icon" type="image/png" href="/console/logo.png">
  <link rel="stylesheet" href="/console/tokens.css?v=20261025-v19">
  <link rel="stylesheet" href="/console/style.css?v=20261025-v19">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-brand">
        <img class="brand-mark" src="/console/logo.png" alt="">
        <strong>JARVIS</strong>
        <span class="brand-sub">个人中控台</span>
      </div>
      <div class="topbar-status">
        <button class="status-lamp" id="lampOnline" type="button"><i class="lamp-dot ok"></i><span id="lampOnlineText">在线 · 感知中</span></button>
        <button class="status-lamp" id="lampWaiting" type="button"><i class="lamp-dot danger"></i><span id="lampWaitingText">等待你 0</span></button>
        <span class="status-lamp is-static"><i class="lamp-dot faint"></i>脱敏演示</span>
        <button class="icon-btn" id="settingsBtn" title="连接设置">⚙</button>
      </div>
    </header>
    <nav class="tabbar" id="tabbar">
      <button class="tab-item active" data-view="activity">活动流</button>
      <button class="tab-item" data-view="agent">Agent 编排</button>
      <button class="tab-item" data-view="memory">记忆库</button>
      <button class="tab-item" data-view="permissions">权限门控</button>
      <button class="tab-item" data-view="devices">设备与模型</button>
    </nav>
    <select class="tab-select" id="tabSelect" aria-label="选择页面">
      <option value="activity">活动流</option>
      <option value="agent">Agent 编排</option>
      <option value="memory">记忆库</option>
      <option value="permissions">权限门控</option>
      <option value="devices">设备与模型</option>
    </select>
    <main class="main">
      <div class="stream-notice" id="streamNotice" hidden></div>
      <section id="view-activity" class="view active"></section>
      <section id="view-agent" class="view"></section>
      <section id="view-memory" class="view"></section>
      <section id="view-permissions" class="view"></section>
      <section id="view-devices" class="view"></section>
      <footer class="shell-footer">
        <span>单人工作空间 · 所有人名、消息与设备均为虚构演示</span>
        <span>操作留痕 / 高风险逐次许可</span>
      </footer>
    </main>
  </div>
  <button class="waiting-pill" id="waitingPill" type="button" hidden>
    <i class="lamp-dot danger"></i>
    <span id="waitingPillText">等待你许可 · 1</span>
  </button>
  <dialog id="settingsDialog">
    <form method="dialog" class="dialog-card" id="settingsForm">
      <div class="dialog-head"><div><p class="eyebrow">RUNTIME ACCESS</p><h2>连接设置</h2></div><button class="close-btn" type="button" id="settingsClose">×</button></div>
      <label>API 地址<input id="apiUrl" placeholder="https://your-jarvis-host"></label>
      <label>设备 Token<input id="apiToken" type="password" placeholder="DEVICE_TOKEN"></label>
      <p class="muted">Token 只保存在本浏览器的 sessionStorage 中。</p>
      <button class="primary-btn" value="default">保存并连接</button>
    </form>
  </dialog>
  <div id="toast"></div>
  <script type="module" src="/console/app.js?v=20261025-v19"></script>
</body>
</html>
